<!doctype html>
<meta charset="utf-8">
<title>bancada da imagem</title>
<body style="font:12px monospace;background:#111;color:#eee;padding:16px">
<pre id="saida">medindo...</pre>
<div id="fig" style="display:flex;gap:8px;flex-wrap:wrap"></div>
<script type="module">
/*
 * A BANCADA DA TELA DE IMAGEM
 * ===========================
 *
 * "Ficou melhor" nao pode ser opiniao. Aqui a pergunta vira mensuravel com o
 * truque de sempre: pega-se uma imagem GRANDE, encolhe-se ela, e pede-se a
 * rede para desfazer o estrago. Como o original grande existe, da para dizer
 * o quanto ela acertou - e comparar duas configuracoes pelo mesmo numero.
 *
 * PSNR mede o erro por pixel. Serve para pegar regressao grosseira, mas nao
 * enxerga "plastificado". Por isso vai junto o ERRO DE BORDA: a diferenca
 * entre os gradientes, que e onde halo e borrado aparecem.
 */

const saida = document.getElementById("saida");
saida.textContent = "";
const linha = (t) => { saida.textContent += t + "\n"; console.log("[BANCADA]", t); };

// ---------- a imagem de referencia ----------
// Detalhe fino de proposito: texto pequeno, linhas finas, textura e degrade.
// E onde ampliacao ruim se denuncia.
const W = 448, H = 448;
const ref = document.createElement("canvas");
ref.width = W; ref.height = H;
const g = ref.getContext("2d", { willReadFrequently: true });

g.fillStyle = "#f4f1ea"; g.fillRect(0, 0, W, H);
// degrade de fundo
const grad = g.createLinearGradient(0, 0, W, H);
grad.addColorStop(0, "#e8dfd0"); grad.addColorStop(1, "#c9d4dd");
g.fillStyle = grad; g.fillRect(0, 0, W, H);
// linhas finas, o pior caso
g.strokeStyle = "#1a1a1a"; g.lineWidth = 1;
for (let i = 0; i < 14; i++) {
  g.beginPath(); g.moveTo(10 + i * 12, 10); g.lineTo(10 + i * 12, 120); g.stroke();
}
// texto pequeno
g.fillStyle = "#101010";
g.font = "bold 26px sans-serif"; g.fillText("GONCALVES 23", 14, 160);
g.font = "13px sans-serif"; g.fillText("tamanho P - algodao 30.1 penteado", 14, 182);
// circulos com borda dura
for (let i = 0; i < 5; i++) {
  g.beginPath(); g.arc(60 + i * 82, 250, 30, 0, Math.PI * 2);
  g.fillStyle = ["#c0392b", "#e0a800", "#1f7a4d", "#2b5fa8", "#6b3fa0"][i]; g.fill();
  g.lineWidth = 3; g.strokeStyle = "#101010"; g.stroke();
}
// textura fina
const img = g.getImageData(0, 300, W, 148);
for (let i = 0; i < img.data.length; i += 4) {
  const n = ((i / 4) % 7) * 9 + (Math.floor(i / 4 / W) % 5) * 11;
  img.data[i] = 90 + n; img.data[i + 1] = 110 + (n % 60); img.data[i + 2] = 130 + (n % 40);
}
g.putImageData(img, 0, 300);

const referencia = g.getImageData(0, 0, W, H);

// ---------- o encolhimento: e disto que a rede parte ----------
const FATOR = 4;
const pequeno = document.createElement("canvas");
pequeno.width = W / FATOR; pequeno.height = H / FATOR;
const gp = pequeno.getContext("2d", { willReadFrequently: true });
gp.imageSmoothingEnabled = true; gp.imageSmoothingQuality = "high";
gp.drawImage(ref, 0, 0, pequeno.width, pequeno.height);
const entrada = gp.getImageData(0, 0, pequeno.width, pequeno.height);

// ---------- as medidas ----------
function psnr(a, b) {
  let soma = 0, n = 0;
  for (let i = 0; i < a.length; i += 4) {
    for (let k = 0; k < 3; k++) { const d = a[i + k] - b[i + k]; soma += d * d; n++; }
  }
  const eqm = soma / n;
  return eqm === 0 ? 99 : 10 * Math.log10(255 * 255 / eqm);
}

/** O erro nas BORDAS: e onde halo e borrado moram, e o PSNR quase nao ve. */
function erroDeBorda(a, b, largura, altura) {
  const cinza = (px, i) => (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114);
  let soma = 0, n = 0;
  for (let y = 1; y < altura - 1; y++) {
    for (let x = 1; x < largura - 1; x++) {
      const i = (y * largura + x) * 4;
      const ga = Math.abs(cinza(a, i) - cinza(a, i + 4))
               + Math.abs(cinza(a, i) - cinza(a, i + largura * 4));
      const gb = Math.abs(cinza(b, i) - cinza(b, i + 4))
               + Math.abs(cinza(b, i) - cinza(b, i + largura * 4));
      soma += Math.abs(ga - gb); n++;
    }
  }
  return soma / n;
}

function mostrar(rotulo, dados) {
  const c = document.createElement("canvas");
  c.width = dados.width; c.height = dados.height;
  c.getContext("2d").putImageData(dados, 0, 0);
  c.style.cssText = "width:224px;image-rendering:pixelated;border:1px solid #444";
  const cx = document.createElement("div");
  cx.append(c, Object.assign(document.createElement("div"),
    { textContent: rotulo, style: "font-size:10px;color:#999" }));
  document.getElementById("fig").append(cx);
}

// ---------- a base: so ampliacao, sem rede ----------
const limpoTela = document.createElement("canvas");
limpoTela.width = W; limpoTela.height = H;
const gl = limpoTela.getContext("2d", { willReadFrequently: true });
gl.imageSmoothingEnabled = true; gl.imageSmoothingQuality = "high";
gl.drawImage(pequeno, 0, 0, W, H);
const soAmpliada = gl.getImageData(0, 0, W, H);

linha(`referencia ${W}x${H} | entrada ${pequeno.width}x${pequeno.height} | volta para ${W}x${H}`);
linha("");
linha("configuracao            PSNR    erro de borda");
const base = { p: psnr(referencia.data, soAmpliada.data),
               b: erroDeBorda(referencia.data, soAmpliada.data, W, H) };
linha(`so ampliada (sem rede)  ${base.p.toFixed(2)}   ${base.b.toFixed(3)}`);
mostrar("so ampliada", soAmpliada);

// ---------- a rede, em varias doses ----------
const w = new Worker("/imagem-worker.js", { type: "module" });
w.onerror = (e) => linha("ERRO NO WORKER: " + e.message);

// O que comparar. Cada entrada e uma corrida da rede.
//
// A pergunta desta rodada: para uma imagem que precisa de MAIS de 4x, passar a
// rede duas vezes ganha de passar uma vez e esticar o resto?
const CASOS = [
  { nome: "rapido (4,7 MB) ", fator: 4, escala: 4, modelo: "rapido" },
  { nome: "capricho (29 MB)", fator: 4, escala: 4, modelo: "capricho" },
];
let vez = 0;

/** Encolhe a referencia pelo fator do caso: e dai que a rede vai partir. */
function entradaDoCaso(fator) {
  const c = document.createElement("canvas");
  c.width = W / fator; c.height = H / fator;
  const g2 = c.getContext("2d", { willReadFrequently: true });
  g2.imageSmoothingEnabled = true; g2.imageSmoothingQuality = "high";
  g2.drawImage(ref, 0, 0, c.width, c.height);
  return g2.getImageData(0, 0, c.width, c.height);
}

let baseDoCaso = null;

function proxima() {
  if (vez >= CASOS.length) {
    linha("");
    linha("PSNR: maior e melhor. Erro de borda: MENOR e melhor.");
    linha("FIM");
    return;
  }
  const caso = CASOS[vez];
  const ent = entradaDoCaso(caso.fator);

  // A base de comparacao muda com o fator: ampliar 16x sem rede e pior do que
  // ampliar 4x sem rede, e comparar contra a base errada esconderia isso.
  const t = document.createElement("canvas");
  t.width = W; t.height = H;
  const gt = t.getContext("2d", { willReadFrequently: true });
  gt.imageSmoothingEnabled = true; gt.imageSmoothingQuality = "high";
  const tp = document.createElement("canvas");
  tp.width = ent.width; tp.height = ent.height;
  tp.getContext("2d").putImageData(ent, 0, 0);
  gt.drawImage(tp, 0, 0, W, H);
  const semRede = gt.getImageData(0, 0, W, H);
  baseDoCaso = { p: psnr(referencia.data, semRede.data),
                 b: erroDeBorda(referencia.data, semRede.data, W, H) };
  linha(`${caso.nome}  entrada ${ent.width}x${ent.height}`
    + `  | so ampliada: PSNR ${baseDoCaso.p.toFixed(2)}, borda ${baseDoCaso.b.toFixed(3)}`);

  const copia = new Uint8ClampedArray(ent.data);
  caso.comecou = performance.now();
  w.postMessage({ id: vez, pixels: copia.buffer, largura: ent.width,
                  altura: ent.height, escala: caso.escala, modelo: caso.modelo },
                [copia.buffer]);
}

w.onmessage = (e) => {
  const d = e.data;
  if (d.andamento) return;
  if (d.erro) { linha("ERRO: " + d.erro); vez++; proxima(); return; }

  const r = d.resultado;

  // A rede pode ter parado antes de W x H (caso "16x, uma passada"): o resto do
  // caminho vai por ampliacao comum, que e exatamente o que a tela faria.
  const paraTamanhoFinal = (buffer) => {
    if (r.largura === W && r.altura === H) return new ImageData(buffer, W, H);
    const c = document.createElement("canvas");
    c.width = r.largura; c.height = r.altura;
    c.getContext("2d").putImageData(new ImageData(buffer, r.largura, r.altura), 0, 0);
    const f = document.createElement("canvas");
    f.width = W; f.height = H;
    const gf = f.getContext("2d", { willReadFrequently: true });
    gf.imageSmoothingEnabled = true; gf.imageSmoothingQuality = "high";
    gf.drawImage(c, 0, 0, W, H);
    return gf.getImageData(0, 0, W, H);
  };

  const rede = paraTamanhoFinal(r.pixels);
  const limpoDaRede = paraTamanhoFinal(r.limpo);

  for (const dose of [0, 40, 70, 100]) {
    const m = dose / 100;
    const mix = new Uint8ClampedArray(rede.data.length);
    for (let i = 0; i < mix.length; i += 4) {
      for (let k = 0; k < 3; k++) {
        mix[i + k] = limpoDaRede.data[i + k]
          + (rede.data[i + k] - limpoDaRede.data[i + k]) * m;
      }
      mix[i + 3] = 255;
    }
    const p = psnr(referencia.data, mix);
    const b = erroDeBorda(referencia.data, mix, W, H);
    const sinal = (v, bb) => (v >= bb ? "+" : "") + (v - bb).toFixed(2);
    linha(`   dose ${String(dose).padStart(3)}%   ${p.toFixed(2)}   ${b.toFixed(3)}`
      + `   (PSNR ${sinal(p, baseDoCaso.p)}, borda ${sinal(b, baseDoCaso.b)})`);
    if (dose === 70) mostrar(`${CASOS[vez].nome.trim()}, 70%`, new ImageData(mix, W, H));
  }
  linha(`   levou ${((performance.now() - CASOS[vez].comecou) / 1000).toFixed(1)}s`);
  linha("");

  vez++;
  proxima();
};

mostrar("referencia", referencia);
proxima();
</script>
