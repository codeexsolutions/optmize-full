[package]
name = "encolher"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "O sparrow em WebAssembly: encolhe o rolo de um encaixe pronto sem deixar peça em cima de peça."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# O encaixador de referência (MIT). Fixado no commit que foi MEDIDO contra o
# nosso motor em 2026-09-21 (ver o cabeçalho de src/lib.rs): trocar de commit é
# mexer no motor, e mexida no motor passa pela bancada.
#
# DESDE 2026-11-12 É UMA CÓPIA LOCAL (`sparrow/`), do MESMO commit, com uma
# mudança marcada "[Optmize]": o corte guiado pelo desperdício
# (`sparrow/src/util/corte_guiado.rs`), desligado por padrão. Sem o ajuste
# `split_guiado`, o comportamento é o do commit original, linha por linha.
sparrow = { path = "sparrow" }
# A mesma versão que o sparrow daquele commit exige. Aparece aqui porque a ponte
# fala a língua dele (instância, solução, importação) diretamente.
jagua-rs = { version = "=0.8.3", features = ["spp"] }
rand = "0.10"
serde_json = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
