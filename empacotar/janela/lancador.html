<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Optimize</title>
<!--
  ===========================================================================
  O LANÇADOR — a janelinha que abre antes do programa
  ===========================================================================

  Uma janela própria, pequena e sem borda (ver `abrir_lancador` em
  `src-tauri/src/main.rs`). Ela aparece em três momentos:

    - toda abertura, enquanto o programa procura versão nova e o servidor sobe;
    - quando há versão nova (na abertura ou com o programa aberto): mostra as
      correções e as adições e PERGUNTA — "Atualizar agora" ou "Depois";
    - depois do "Atualizar agora": conta o download e avisa que vai instalar.

  Quem manda é o Rust, chamando `window.lancador({ fase, ... })`. A página só
  desenha o último estado que recebeu; a única coisa que ela devolve é a
  resposta da pergunta, pelo comando `responder_atualizacao`.

  Arquivo solto, sem servidor: no fim de uma instalação o Node já morreu. Por
  isso as cores estão escritas aqui, as mesmas de `index.html`.
-->
<style>
  :root {
    --bg: #0d0d0f;
    --text: #f4f2ef;
    --dim: #8f8983;
    --faint: #5a5652;
    --linha: rgba(244, 242, 239, .09);
    --accent: #ff531f;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    position: relative;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    cursor: default;
  }

  /*
    Só o `body` arrasta a janela (`data-tauri-drag-region`). No Tauri 2 o
    atributo vale para o elemento clicado, não para os filhos — então os filhos
    não pegam clique nenhum, e todo clique cai no `body`.
  */
  body > * { pointer-events: none; }

  /*
    A MARCA GRANDE, cortada pela borda da direita. É o desenho da tela, e não
    um enfeite: o logotipo inteiro e pequeno no meio seria a abertura de
    qualquer programa.
  */
  .marca {
    position: absolute;
    right: -84px;
    top: 66px;
    width: 330px;
    height: 330px;
    opacity: 0;
    transform: translateX(28px);
    animation: chegar .9s cubic-bezier(.16, 1, .3, 1) .05s forwards;
  }
  .marca img { width: 100%; height: 100%; display: block; }

  /* A fileira de cima: marca pequena e nome à esquerda, versão à direita. */
  .topo {
    position: absolute;
    z-index: 2;
    left: 32px;
    right: 32px;
    top: 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--dim);
  }
  .topo .quem { display: flex; align-items: center; gap: 9px; }
  .topo .quem img { width: 18px; height: 18px; }
  .topo .versao { font-variant-numeric: tabular-nums; }

  .nome {
    position: absolute;
    left: 30px;
    top: 112px;
    margin: 0;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    font-size: 64px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -.035em;
    opacity: 0;
    transform: translateY(8px);
    animation: subir .7s cubic-bezier(.16, 1, .3, 1) .15s forwards;
  }

  .autor {
    position: absolute;
    left: 33px;
    top: 186px;
    margin: 0;
    font-size: 13px;
    color: var(--dim);
    opacity: 0;
    animation: subir .7s cubic-bezier(.16, 1, .3, 1) .25s forwards;
  }

  /* O aviso de versão nova ou de primeira abertura, quando há. */
  .novidade {
    position: absolute;
    left: 32px;
    top: 222px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    padding: 6px 10px;
    border: 1px solid var(--linha);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text);
    opacity: 0;
    animation: subir .6s cubic-bezier(.16, 1, .3, 1) .4s forwards;
  }
  .novidade[hidden] { display: none; }
  .novidade::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* ── O pé: o que está acontecendo e a barra ─────────────────────────── */

  /*
    O PÉ É UMA FAIXA, com fundo e um traço em cima: ela corta a marca grande
    de propósito, e a barra nunca passa por cima do desenho.
  */
  .pe {
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 18px 32px 24px;
    background: var(--bg);
    border-top: 1px solid var(--linha);
  }

  .linha {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 11px;
    font-size: 13px;
  }
  .status { color: var(--text); }
  .detalhe { color: var(--dim); margin-left: 8px; }
  .numero { color: var(--dim); font-variant-numeric: tabular-nums; }

  .trilho {
    position: relative;
    height: 3px;
    border-radius: 3px;
    background: var(--linha);
    overflow: hidden;
  }

  /* A barra com número: cresce até a porcentagem. */
  .barra {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 100%;
    border-radius: inherit;
    background: var(--accent);
    transform-origin: left;
    transform: scaleX(0);
    transition: transform .45s cubic-bezier(.16, 1, .3, 1);
  }

  /* Sem número (procurando, abrindo, instalando): um trecho que vai e volta. */
  .trilho.sem-numero .barra {
    width: 28%;
    transition: none;
    animation: vaivem 1.5s cubic-bezier(.65, 0, .35, 1) infinite;
  }

  /* ── A pergunta: versão nova, o que mudou e os dois botões ─────────── */

  .notas {
    position: absolute;
    z-index: 2;
    left: 32px;
    right: 32px;
    top: 64px;
    bottom: 96px;
    display: none;
    flex-direction: column;
    pointer-events: auto;
  }
  .notas h2 {
    margin: 0 0 4px;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -.02em;
  }
  .notas .sub { margin: 0 0 14px; font-size: 13px; color: var(--dim); }
  .notas .lista {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 16px;
    border: 1px solid var(--linha);
    border-radius: 8px;
    background: rgba(13, 13, 15, .92);
    user-select: text;
    cursor: auto;
  }
  .notas h3 {
    margin: 12px 0 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .notas h3:first-child { margin-top: 0; }
  .notas ul { margin: 0; padding-left: 18px; }
  .notas li { margin: 0 0 5px; font-size: 13px; line-height: 1.45; }
  .notas p.vazio { margin: 0; font-size: 13px; color: var(--dim); }

  .botoes { display: none; justify-content: flex-end; gap: 10px; pointer-events: auto; }
  .botoes button {
    font: inherit;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--linha);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .botoes button.agora { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .botoes button:hover { filter: brightness(1.12); }
  .botoes button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  body.perguntando .nome,
  body.perguntando .autor,
  body.perguntando .novidade { display: none; }
  body.perguntando .marca { opacity: .18; animation: none; transform: none; }
  body.perguntando .notas { display: flex; }
  body.perguntando .pe .linha,
  body.perguntando .pe .trilho { display: none; }
  body.perguntando .botoes { display: flex; }

  @keyframes vaivem {
    from { transform: translateX(-100%); }
    to   { transform: translateX(360%); }
  }
  @keyframes chegar { to { opacity: 1; transform: none; } }
  @keyframes subir  { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .marca, .nome, .autor, .novidade { animation: none; opacity: 1; transform: none; }
    .trilho.sem-numero .barra { animation: none; transform: none; width: 100%; opacity: .35; }
  }
</style>
</head>
<body data-tauri-drag-region>
  <div class="marca"><img src="icone.png" alt=""></div>

  <div class="topo">
    <span class="quem"><img src="icone.png" alt="">CodeEx Solutions</span>
    <span class="versao" id="versao"></span>
  </div>

  <h1 class="nome">Optmize</h1>
  <p class="autor">Moldes, encaixe e impressão</p>
  <p class="novidade" id="novidade" hidden></p>

  <div class="notas" id="notas">
    <h2 id="notas-titulo"></h2>
    <p class="sub">O Optmize fecha, instala e reabre sozinho. Nada do que está salvo se perde.</p>
    <div class="lista" id="notas-lista"></div>
  </div>

  <div class="pe">
    <div class="linha">
      <span><span class="status" id="status">Iniciando</span><span class="detalhe" id="detalhe"></span></span>
      <span class="numero" id="numero"></span>
    </div>
    <div class="trilho sem-numero" id="trilho"><div class="barra" id="barra"></div></div>
    <div class="botoes">
      <button type="button" id="depois" onclick="responder(false)">Depois</button>
      <button type="button" class="agora" id="agora" onclick="responder(true)">Atualizar agora</button>
    </div>
  </div>

<script>
  /*
   * O que cada fase diz. `versaoNova` é a que está chegando; `versao` é a
   * instalada.
   */
  var TEXTOS = {
    verificando: function () { return ["Procurando atualizações", ""]; },
    pergunta:    function () { return ["", ""]; },
    baixando:    function (e) { return ["Baixando a versão " + e.versaoNova, ""]; },
    instalando:  function (e) { return ["Instalando a versão " + e.versaoNova, "o Optmize reabre sozinho"]; },
    abrindo:     function () { return ["Abrindo", ""]; },
    pronto:      function () { return ["Pronto", ""]; },
  };

  function texto(id, valor) {
    document.getElementById(id).textContent = valor || "";
  }

  /*
   * As notas chegam como texto, do jeito que `empacotar/notas-do-lancamento.js`
   * as escreve: uma linha de título ("Correções", "Adições") e itens começando
   * com "- ". Montadas com `textContent`: o texto vem do servidor.
   */
  function desenharNotas(texto) {
    var lista = document.getElementById("notas-lista");
    lista.textContent = "";
    var ul = null;
    (texto || "").split(/\r?\n/).forEach(function (linha) {
      linha = linha.trim();
      if (!linha) return;
      var item = /^[-•*]\s+(.*)$/.exec(linha);
      if (item) {
        if (!ul) { ul = document.createElement("ul"); lista.appendChild(ul); }
        var li = document.createElement("li");
        li.textContent = item[1];
        ul.appendChild(li);
      } else {
        var h3 = document.createElement("h3");
        h3.textContent = linha.replace(/^#+\s*/, "").replace(/:$/, "");
        lista.appendChild(h3);
        ul = null;
      }
    });
    if (!lista.firstChild) {
      var p = document.createElement("p");
      p.className = "vazio";
      p.textContent = "Melhorias de estabilidade e desempenho.";
      lista.appendChild(p);
    }
  }

  var respondido = false;

  /* A resposta da pergunta volta para o Rust (`responder_atualizacao`). */
  function responder(agora) {
    if (respondido) return;
    respondido = true;
    var ipc = window.__TAURI_INTERNALS__;
    if (ipc) ipc.invoke("responder_atualizacao", { agora: agora });
  }

  document.addEventListener("keydown", function (ev) {
    if (!document.body.classList.contains("perguntando")) return;
    if (ev.key === "Escape") responder(false);
  });

  window.lancador = function (e) {
    if (!e || !TEXTOS[e.fase]) return;

    var perguntando = e.fase === "pergunta";
    if (perguntando && !document.body.classList.contains("perguntando")) {
      respondido = false;
      document.getElementById("notas-titulo").textContent = "Versão " + e.versaoNova + " disponível";
      desenharNotas(e.notas);
      setTimeout(function () { document.getElementById("agora").focus(); }, 0);
    }
    document.body.classList.toggle("perguntando", perguntando);

    if (e.versao) texto("versao", "Versão " + e.versao);

    var aviso = document.getElementById("novidade");
    if (e.novidade === "atualizado" && e.anterior) {
      aviso.textContent = "Atualizado da " + e.anterior + " para a " + e.versao;
      aviso.hidden = false;
    } else if (e.novidade === "primeira") {
      aviso.textContent = "Primeira abertura: preparando tudo";
      aviso.hidden = false;
    }

    var linhas = TEXTOS[e.fase](e);
    texto("status", linhas[0]);
    texto("detalhe", linhas[1]);

    var trilho = document.getElementById("trilho");
    var barra = document.getElementById("barra");
    var temNumero = typeof e.porcento === "number" || e.fase === "pronto";
    trilho.classList.toggle("sem-numero", !temNumero);
    if (temNumero) {
      var p = e.fase === "pronto" ? 100 : Math.max(0, Math.min(100, e.porcento));
      barra.style.transform = "scaleX(" + p / 100 + ")";
      texto("numero", e.fase === "baixando" ? p + "%" : "");
    } else {
      barra.style.transform = "";
      texto("numero", "");
    }
  };
</script>
</body>
</html>
